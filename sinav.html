<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Spring Certified QC Sınavı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
:root{--red:#C8102E;--red-d:#9E0C24;--green:#21A038;--fg:#1B211C;--mute:#5B665E;--line:#DDE4DD;--bg:#F6F8F5}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 Inter,system-ui,sans-serif;color:var(--fg);background:var(--bg)}
header{background:var(--red);color:#fff;padding:18px max(16px,env(safe-area-inset-left)) 16px;position:sticky;top:0;z-index:5}
header .w{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
header p{margin:0;font-size:12px;font-weight:700;letter-spacing:.12em}header h1{margin:2px 0 0;font-size:22px}
#sure{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;background:#fff;color:var(--red);border-radius:10px;padding:6px 10px}
main{max-width:760px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}input[type=text],input[type=tel]{width:100%;padding:13px;font:inherit;border:1.5px solid var(--line);border-radius:10px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:15px 18px;width:100%;background:var(--red);color:#fff;margin-top:16px}button:disabled{opacity:.5}
button.sec{background:#fff;color:var(--fg);border:1.5px solid var(--line)}
.q{font-weight:700;margin:0 0 10px}.qn{color:var(--red);font-size:12px;letter-spacing:.1em;font-weight:700;margin:0 0 4px}
.o{display:flex;gap:10px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:10px;margin-top:8px}
.o input{width:20px;height:20px;accent-color:var(--red);flex:none}.o:has(input:checked){border-color:var(--red);background:#FDECEF}
.big{font-size:54px;font-weight:700;margin:6px 0}.ok{color:var(--green)}.no{color:var(--red)}.mute{color:var(--mute);font-size:14px}
.err{color:var(--red);font-weight:600;margin-top:10px}a.dl{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:12px;padding:15px;background:var(--green);color:#fff;margin-top:16px}
[hidden]{display:none!important}
</style></head><body>
<header><div class="w"><div><p>SPRING CERTIFIED QC</p><h1>SINAV</h1></div><div id="sure" hidden>60:00</div></div></header>
<main>
<section id="giris"><div class="card">
<p style="margin:0"><b>25 soru · 60 dakika · geçme notu 20 doğru.</b></p><p class="mute" style="margin:6px 0 0">Her katılımcının 2 hakkı vardır. Sorular ve sıraları her katılımcıda farklıdır. Kitap ve notlar açıktır. Sınava telefondan ya da bilgisayardan girilir.</p>
<label for="ad">Ad Soyad</label><input id="ad" type="text" autocomplete="name">
<label for="firma">Firma / Fabrika</label><input id="firma" type="text" autocomplete="organization">
<label for="tel">Cep telefonu</label><input id="tel" type="tel" inputmode="numeric" placeholder="05xx xxx xx xx" autocomplete="tel">
<button id="basla">Sınavı başlat</button><p class="err" id="e1" hidden></p></div></section>
<section id="sinav" hidden><div id="sorular"></div><button id="bitir">Sınavı bitir ve gönder</button><p class="err" id="e2" hidden></p></section>
<section id="sonuc" hidden><div class="card" id="sonuc-k"></div></section>
</main>
<script src="api.js"></script>
<script>
const API=window.SCQC_API||'';
const $=id=>document.getElementById(id);let Q=[],kod='',kisi=null,bitis=0,tm=null,gonderildi=false;
const L=['A','B','C','D'];
function err(el,t){el.textContent=t;el.hidden=!t}
async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return r.json()}
function sonuc(h){$('giris').hidden=true;$('sinav').hidden=true;$('sure').hidden=true;$('sonuc').hidden=false;$('sonuc-k').innerHTML=h;scrollTo(0,0)}
function kilit(){sonuc('<p class="qn">KİLİTLİ</p><p class="q">İki hak da kullanıldı.</p><p class="mute">Sınava yeniden girilebilmesi için sınavın eğitmen tarafından tekrar açılması gerekir. Eğitmene haber verilir.</p>')}
$('basla').onclick=async()=>{err($('e1'),'');if(!API)return err($('e1'),'Sınav henüz açılmadı. Eğitmene haber verilir.');kisi={ad:$('ad').value.trim(),firma:$('firma').value.trim(),tel:$('tel').value};
 if(kisi.ad.length<3||kisi.firma.length<2||kisi.tel.replace(/\D/g,'').length<10)return err($('e1'),'Ad soyad, firma ve cep telefonu eksiksiz yazılmalıdır.');
 $('basla').disabled=true;$('basla').textContent='Kontrol ediliyor…';
 try{const r=await api({islem:'basla',...kisi});
  if(r.hata)throw new Error(r.hata);
  if(r.zaten)return sonuc('<p class="qn">TAMAMLANDI</p><p class="q">Sınav daha önce geçildi.</p><p class="mute">Sertifika, 20 gölge inspection geçilince verilir.</p>');
  if(r.kilitli)return kilit();
  Q=r.sorular;kod=r.kod;baslat(r.hak,r.maxhak,r.kalan);
 }catch(x){err($('e1'),'Bağlantı kurulamadı. İnternet kontrol edilip tekrar denenir.');$('basla').disabled=false;$('basla').textContent='Sınavı başlat'}};
function baslat(hak,max,kalan){let h='<div class="card"><p class="qn">HAK '+hak+' / '+max+'</p><p class="mute" style="margin:0">Her sorunun tek doğru cevabı vardır. Süre bitince sınav kendiliğinden gönderilir.</p></div>';
 Q.forEach((q,i)=>{h+='<div class="card"><p class="qn">SORU '+(i+1)+' / 25</p><p class="q">'+q.q+'</p>'+q.o.map((t,j)=>'<label class="o"><input type="radio" name="q'+i+'" value="'+j+'"><span>'+t+'</span></label>').join('')+'</div>'});
 $('sorular').innerHTML=h;$('giris').hidden=true;$('sinav').hidden=false;$('sure').hidden=false;scrollTo(0,0);
 bitis=Date.now()+kalan*1000;tm=setInterval(()=>{const k=Math.max(0,bitis-Date.now());const m=Math.floor(k/60000),s=Math.floor(k%60000/1000);$('sure').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(k<=0)gonder(true)},500)}
$('bitir').onclick=()=>gonder(false);
async function gonder(zorla){if(gonderildi)return;const c=Q.map((q,i)=>{const s=document.querySelector('input[name=q'+i+']:checked');return s?Number(s.value):-1});
 const bos=c.filter(x=>x<0).length;if(!zorla&&bos){err($('e2'),bos+' soru boş. Bütün sorular işaretlendikten sonra gönderilir.');return}
 gonderildi=true;clearInterval(tm);$('bitir').disabled=true;$('bitir').textContent='Gönderiliyor…';err($('e2'),'');
 try{const r=await api({islem:'bitir',...kisi,kod,cevaplar:c});if(r.hata)throw new Error(r.hata);if(r.kilitli)return kilit();
  if(r.gecti){sonuc('<p class="qn" style="color:var(--green)">GEÇİLDİ</p><p class="big ok">'+r.puan+' / 25</p><p class="q">Tebrikler, sınav geçildi.</p><p class="mute">Sertifika hemen verilmez; 20 gölge inspection geçilince verilir.</p>')}
  else if(r.kalan>0){sonuc('<p class="qn">GEÇİLEMEDİ</p><p class="big no">'+r.puan+' / 25</p><p class="q">Geçmek için en az 20 doğru gerekir.</p><p class="mute">1 hak daha vardır. Konular gözden geçirildikten sonra tekrar denenir.</p><button onclick="location.reload()">Tekrar dene</button>')}
  else{sonuc('<p class="qn">GEÇİLEMEDİ</p><p class="big no">'+r.puan+' / 25</p><p class="q">İki hak da kullanıldı.</p><p class="mute">Sınava yeniden girilebilmesi için sınavın eğitmen tarafından tekrar açılması gerekir.</p>')}
 }catch(x){gonderildi=false;$('bitir').disabled=false;$('bitir').textContent='Sınavı bitir ve gönder';err($('e2'),'Gönderilemedi. İnternet kontrol edilip tekrar basılır; cevaplar durmaktadır.')}}
addEventListener('beforeunload',e=>{if(!$('sinav').hidden&&!gonderildi){e.preventDefault();e.returnValue=''}});
</script></body></html>
